name: Venue Enricher

on:
  # Run manually from GitHub UI or mobile app
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to process (1, 2, 3, 4, or leave blank for all)"
        required: false
        default: ""
      limit:
        description: "Max venues to enrich (leave blank for no limit)"
        required: false
        default: ""

  # Automatic daily run at 9 AM PT (16:00 UTC)
  schedule:
    - cron: "0 16 * * *"

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours max
    permissions:
      contents: write   # needed to commit enrichment_progress.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-requests-anthropic

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Run enricher
        env:
          WM_SECRET:                ${{ secrets.WM_SECRET }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
          GOOGLE_PLACES_API_KEY:    ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.tier }}" ]; then
            ARGS="$ARGS --tier ${{ github.event.inputs.tier }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python3 venue_enricher.py $ARGS

      - name: Commit progress
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add enrichment_progress.json
          git diff --staged --quiet || git commit -m "chore: update enrichment progress [skip ci]"
          git push
